name: gateway

on:
  push:
    paths: ["gateway/**", "pyproject.toml", ".github/workflows/gateway.yml"]
  pull_request:
    paths: ["gateway/**", "pyproject.toml", ".github/workflows/gateway.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements-dev.txt
      - run: python -m pytest
